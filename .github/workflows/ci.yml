# Runs the same checks as bin/ci on every pull request and on main, on the oldest and
# newest Python versions Tempo supports.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    # Pinned: ubuntu-latest moved to 26.04, which has no Python 3.9 build.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so tests/test_previous_release.py finds the last release.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run bin/ci
        run: bin/ci
