[project]
name = "tempo"
version = "0.5.4"
description = "Claude Code plugin: the questions Claude asks you, in SQLite with a local page to answer them"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.ruff]
target-version = "py39"
line-length = 100
# bin/check-version and bin/media are Python without the .py ending.
extend-include = ["bin/check-version", "bin/media"]
# Git worktrees under .claude/ are other copies of this repository, not its source.
extend-exclude = [".claude", ".tempo-dev"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, flake8-bandit, ruff's own
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "RUF"]
# The code uses %-formatting throughout: Python 3.9 f-strings cannot reuse the
# outer quote, which makes them awkward with question["key"] lookups.
ignore = ["UP031"]

[tool.ruff.lint.per-file-ignores]
# The security rules are for the shipped code, not the tests.
"tests/*" = ["S"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# subprocess runs only fixed argument lists with no shell (git, and this package's
# own server). Ruff's S603/S607 still flag each call, with a reason at the line.
skips = ["B404", "B603", "B607"]

[tool.mypy]
# Checks the shipped code against the oldest Python Tempo supports; tests are not typed.
files = ["tempo"]
python_version = "3.9"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
# Report only: bin/ci prints how much of tempo/ the tests run, and never fails on it.
source = ["tempo"]
omit = ["tests/*", ".claude/*"]
# Also measure the bin/tempo processes the end-to-end tests start (needs the .venv Python
# first on PATH, which bin/ci does). Each process writes its own data file to combine.
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
skip_empty = true
